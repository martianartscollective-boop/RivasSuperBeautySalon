<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Playfair+Display:wght@400;700&family=Libre+Caslon+Display&family=Cormorant+Garamond:wght@500;600;700&family=Oswald:wght@400;600;700&family=Abril+Fatface&family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Nunito:wght@400;600;700&family=Inter:wght@400;600;700&family=Merriweather:wght@400;700&family=Work+Sans:wght@400;600;700&family=Poppins:wght@400;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- Rivas Super Salon colors — editable from /admin ---- */
    --sunset-1:#7c2c4b; --sunset-2:#4a1229; --sunset-3:#2e0b1b;
    --dusk-1:#4a1229; --dusk-2:#2e0b1b;
    --gold:#c9972e; --gold-deep:#9c7220;
    --cream:#faf3ec; --paper:#f1dad3;
    --maroon:#7c2c4b; --maroon-deep:#4a1229;
    --teal:#e8657d; --ink:#2b1420; --ink-soft:#5c4a46; --focus:#c9972e;
    --surface:#ffffff;
    --flower-left:#00000000; --flower-right:#00000000; --stem:#00000000;
    --shadow:rgba(46,11,27,0.28); --shadow-soft:rgba(46,11,27,0.16);
    --divider:rgba(124,44,75,0.20);
    --hero-text-shadow:rgba(0,0,0,0.45);
    --hero-overlay-top:rgba(46,11,27,0.55);
    --hero-overlay-bottom:rgba(46,11,27,0.88);

    /* ---- Typography system — all editable from /admin ---- */
    --font-title:'Fraunces', serif;
    --font-body:'Jost', sans-serif;
    --font-base:'Jost', sans-serif;
    --title-scale:1; --body-scale:1; --base-scale:1;
    --title-color:#c9972e;

    /* ---- Hero entrance animation ---- */
    --hero-anim-duration:1.1s;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;font-family:var(--font-base);font-size:calc(1rem * var(--base-scale));color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased;}
  h1,h2,h3{margin:0;} p{margin:0;} a{color:inherit;} img{max-width:100%;display:block;}
  button{font-family:inherit;}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
  .display{font-family:var(--font-title);}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  ::selection{background:var(--gold); color:var(--ink);}

  .tabnav{position:sticky;top:0;z-index:50;background:rgba(43,20,32,0.86);backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);border-bottom:3px solid var(--gold);overflow-x:auto;scrollbar-width:none;}
  .tabnav::-webkit-scrollbar{display:none;}
  .tabnav-inner{display:flex;min-width:max-content;padding:0 12px;}
  .tabnav a{text-decoration:none;color:var(--cream);font-family:var(--font-base);font-size:calc(0.95rem * var(--base-scale));font-weight:500;padding:16px 18px;white-space:nowrap;border-bottom:3px solid transparent;transition:color .2s ease, border-color .2s ease;}
  .tabnav a:hover{color:var(--gold);}
  .tabnav a.active{color:var(--gold);border-color:var(--gold);}
  .translate-btn{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1.5px solid var(--maroon);color:var(--maroon);font-family:var(--font-base);font-weight:600;font-size:calc(0.88rem * var(--base-scale));padding:10px 18px;border-radius:999px;cursor:pointer;white-space:nowrap;margin-bottom:18px;transition:background .2s ease, transform .2s ease;}
  .translate-btn:hover{background:rgba(124,44,75,0.08);transform:translateY(-2px);}
  .translate-btn svg{width:16px;height:16px;flex:none;}

  .hero{position:relative;overflow:hidden;padding:108px 20px 96px;background-size:cover;background-position:center 28%;background-repeat:no-repeat;text-align:center;color:var(--cream);isolation:isolate;}
  .hero-bgzoom{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center 28%;animation:heroZoom 20s ease-in-out infinite alternate;}
  @keyframes heroZoom{from{transform:scale(1);}to{transform:scale(1.07);}}
  .hero-content{position:relative;z-index:2;max-width:900px;margin:0 auto;}
  .presents{font-size:calc(0.85rem * var(--base-scale));letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);opacity:0.95;margin-bottom:20px;font-weight:600;text-shadow:0 1px 6px var(--hero-text-shadow);}
  .hero-logo{width:100%;max-width:min(520px,92%);margin:0 auto 20px;border-radius:10px;box-shadow:0 20px 44px var(--hero-text-shadow);animation-duration:var(--hero-anim-duration);animation-fill-mode:both;animation-timing-function:cubic-bezier(.22,1,.36,1);}
  .hero-title{font-family:var(--font-title);font-weight:600;font-size:calc(clamp(2.6rem,7vw,5rem) * var(--title-scale));line-height:1.02;color:var(--cream);margin:0 0 16px;text-shadow:0 2px 18px var(--hero-text-shadow);animation-duration:var(--hero-anim-duration);animation-fill-mode:both;animation-timing-function:cubic-bezier(.22,1,.36,1);}
  .hero-subtitle{font-family:var(--font-base);font-size:calc(1.15rem * var(--base-scale));color:var(--cream);opacity:0.92;max-width:560px;margin:0 auto 26px;line-height:1.55;text-shadow:0 1px 6px var(--hero-text-shadow);}
  .anim-pop{animation-name:heroPop;}
  .anim-fadeUp{animation-name:heroFadeUp;}
  .anim-slideLeft{animation-name:heroSlideLeft;}
  .anim-flipIn{animation-name:heroFlipIn;}
  .anim-none{animation:none;}
  @keyframes heroPop{0%{transform:scale(0.35) rotate(-6deg);opacity:0;}65%{transform:scale(1.06) rotate(1deg);opacity:1;}100%{transform:scale(1) rotate(0deg);opacity:1;}}
  @keyframes heroFadeUp{0%{transform:translateY(34px);opacity:0;}100%{transform:translateY(0);opacity:1;}}
  @keyframes heroSlideLeft{0%{transform:translateX(-60px);opacity:0;}100%{transform:translateX(0);opacity:1;}}
  @keyframes heroFlipIn{0%{transform:perspective(700px) rotateX(70deg);opacity:0;}100%{transform:perspective(700px) rotateX(0deg);opacity:1;}}
  .hero-meta{font-size:calc(1rem * var(--base-scale));font-weight:500;letter-spacing:0.02em;margin-bottom:32px;text-shadow:0 1px 6px var(--hero-text-shadow);opacity:0.95;}
  .hero-meta .dot{color:var(--gold);margin:0 10px;}
  .btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-base);font-weight:600;font-size:calc(1rem * var(--base-scale));padding:15px 32px;border-radius:999px;text-decoration:none;border:2px solid transparent;cursor:pointer;transition:transform .2s cubic-bezier(.22,1,.36,1), box-shadow .2s ease;}
  .btn:hover{transform:translateY(-3px);}
  .btn-primary{background:linear-gradient(135deg,#ead08b,var(--gold));color:var(--ink);box-shadow:0 6px 0 var(--gold-deep);}
  .btn-primary:hover{box-shadow:0 9px 0 var(--gold-deep);}
  .btn-primary:active{transform:translateY(2px);box-shadow:0 3px 0 var(--gold-deep);}
  .btn-outline{background:transparent;border-color:rgba(250,243,236,0.6);color:var(--cream);}
  .btn-outline:hover{background:rgba(250,243,236,0.12);border-color:var(--cream);}
  .btn-outline-dark{background:transparent;border-color:var(--maroon);color:var(--maroon);}
  .btn-outline-dark:hover{background:rgba(124,44,75,0.08);}

  /* ---- Google Translate widget: keep it invisible except for our own button ---- */
  .goog-te-banner-frame.skiptranslate{display:none !important;}
  body{top:0 !important;}
  .goog-text-highlight{background:none !important;box-shadow:none !important;}
  .goog-tooltip, .goog-tooltip:hover{display:none !important;}
  #google_translate_element{display:none !important;}

  section{padding:76px 20px;}
  .section-inner{max-width:1080px;margin:0 auto;}
  .section-head{margin-bottom:36px;text-align:center;}
  .section-head .display{font-size:calc(clamp(1.8rem,4vw,2.6rem) * var(--title-scale));color:var(--title-color);}
  .section-head .kicker{display:block;font-family:var(--font-base);font-size:calc(0.9rem * var(--base-scale));letter-spacing:0.08em;text-transform:uppercase;color:var(--maroon);font-weight:600;margin-bottom:8px;}
  .section-note{text-align:center;color:var(--ink-soft);font-family:var(--font-body);font-size:calc(1rem * var(--body-scale));max-width:560px;margin:-20px auto 36px;}
  .section-alt{background:var(--paper);}

  .about-grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:48px;align-items:center;}
  .about-text p{margin-bottom:16px;line-height:1.75;font-family:var(--font-body);color:var(--ink-soft);font-size:calc(1.08rem * var(--body-scale));}
  .about-kicker{display:block;font-family:var(--font-base);font-size:calc(0.9rem * var(--base-scale));letter-spacing:0.08em;text-transform:uppercase;color:var(--maroon);font-weight:600;margin-bottom:14px;}
  .stat-row{display:flex;gap:26px;margin-top:26px;flex-wrap:wrap;}
  .stat{min-width:90px;}
  .stat b{display:block;font-family:var(--font-title);font-weight:600;font-size:calc(1.7rem * var(--title-scale));color:var(--maroon);}
  .stat span{font-family:var(--font-base);font-size:calc(0.85rem * var(--base-scale));color:var(--ink-soft);}
  .about-photo{border-radius:6px;overflow:hidden;box-shadow:0 14px 30px var(--shadow-soft);border:6px solid var(--cream);}
  .about-video{border-radius:8px;overflow:hidden;box-shadow:0 16px 34px var(--shadow);aspect-ratio:16/9;border:6px solid var(--cream);background:#000;}
  .about-video iframe,.about-video video{width:100%;height:100%;border:0;display:block;}
  .about-video video{object-fit:contain;background:#000;}

  /* ---------- Services ---------- */
  .svc-tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:40px;}
  .svc-tab{padding:11px 22px;border-radius:999px;font-family:var(--font-base);font-size:calc(0.92rem * var(--base-scale));font-weight:600;cursor:pointer;background:transparent;border:1.5px solid var(--divider);color:var(--maroon);transition:transform .2s cubic-bezier(.22,1,.36,1), background .2s ease, color .2s ease, border-color .2s ease;}
  .svc-tab:hover{transform:translateY(-2px);border-color:var(--maroon);}
  .svc-tab.active{background:linear-gradient(135deg,var(--maroon),var(--maroon-deep));color:var(--cream);border-color:var(--maroon);}
  .svc-panel{display:none;}
  .svc-panel.active{display:block;animation:fadeIn .35s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .svc-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--divider);max-width:780px;margin-left:auto;margin-right:auto;}
  .svc-item{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:20px 12px;border-bottom:1px dashed var(--divider);border-radius:6px;transition:background .2s ease,padding-left .2s ease;}
  .svc-item:hover{background:rgba(124,44,75,0.05);padding-left:16px;}
  .svc-name{font-family:var(--font-title);font-weight:600;font-size:calc(1.18rem * var(--title-scale));color:var(--ink);}
  .svc-desc{font-family:var(--font-body);font-size:calc(0.95rem * var(--body-scale));color:var(--ink-soft);margin-top:5px;line-height:1.55;max-width:50ch;}
  .svc-price{font-family:var(--font-base);font-weight:700;font-size:calc(1.15rem * var(--base-scale));color:var(--maroon);white-space:nowrap;padding-top:2px;}

  /* ---------- Gallery ---------- */
  .gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .gallery-grid .g-item{aspect-ratio:1/1;position:relative;border-radius:6px;overflow:hidden;cursor:pointer;box-shadow:0 6px 18px var(--shadow-soft);}
  .gallery-grid img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.22,1,.36,1);}
  .gallery-grid .g-item:hover img{transform:scale(1.08);}
  .gallery-grid .g-item::after{content:"⤢";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;background:rgba(46,11,27,0);opacity:0;transition:opacity .3s ease, background .3s ease;pointer-events:none;}
  .gallery-grid .g-item:hover::after{opacity:1;background:rgba(46,11,27,0.3);}
  .g-caption{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 8px;background:linear-gradient(0deg,rgba(46,11,27,0.85),transparent);color:#fff;font-family:var(--font-base);font-size:calc(0.8rem * var(--base-scale));opacity:0;transition:opacity .3s ease;pointer-events:none;}
  .gallery-grid .g-item:hover .g-caption{opacity:1;}
  @media (max-width:860px){.gallery-grid{grid-template-columns:repeat(2,1fr);}}
  .lightbox-overlay{position:fixed;inset:0;background:rgba(20,8,14,0.93);z-index:300;display:none;align-items:center;justify-content:center;padding:24px;}
  .lightbox-overlay.show{display:flex;}
  .lightbox-overlay img{max-width:min(92vw,900px);max-height:88vh;border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.5);}
  .lightbox-close{position:absolute;top:22px;right:26px;background:none;border:none;color:#fff;font-size:34px;cursor:pointer;line-height:1;}

  /* ---------- Booking ---------- */
  .booking-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start;}
  .book-band{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--dusk-1),var(--dusk-2));color:var(--cream);border-radius:16px;padding:44px 32px;text-align:center;box-shadow:0 18px 40px var(--shadow);}
  .book-band .eyebrow2{font-family:var(--font-base);font-size:calc(0.85rem * var(--base-scale));letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
  .book-band h3{font-family:var(--font-title);font-weight:600;font-size:calc(1.8rem * var(--title-scale));color:var(--cream);margin:0 0 14px;line-height:1.2;}
  .book-band p{font-family:var(--font-body);font-size:calc(1.05rem * var(--body-scale));line-height:1.6;color:rgba(250,243,236,.88);margin:0 0 24px;}
  .btn-book{display:inline-flex;align-items:center;gap:12px;background:linear-gradient(135deg,#ead08b,var(--gold));color:var(--ink);font-family:var(--font-base);font-weight:700;font-size:calc(1.1rem * var(--base-scale));text-decoration:none;padding:17px 36px;border-radius:999px;box-shadow:0 8px 0 var(--gold-deep),0 16px 30px rgba(0,0,0,.3);transition:transform .2s cubic-bezier(.22,1,.36,1), box-shadow .2s ease;}
  .btn-book:hover{transform:translateY(-3px);box-shadow:0 11px 0 var(--gold-deep),0 20px 34px rgba(0,0,0,.35);}
  .btn-book:active{transform:translateY(3px);box-shadow:0 3px 0 var(--gold-deep);}
  .book-note{margin-top:20px;font-family:var(--font-body);font-size:calc(0.92rem * var(--body-scale));color:rgba(250,243,236,.75);line-height:1.55;}
  .call-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px;}
  .call-card{background:rgba(250,243,236,0.07);border:1px solid rgba(250,243,236,0.16);border-radius:10px;padding:18px 16px;text-align:center;text-decoration:none;color:var(--cream);transition:transform .2s ease, background .2s ease;}
  .call-card:hover{transform:translateY(-3px);background:rgba(250,243,236,0.13);}
  .call-card b{display:block;font-family:var(--font-title);color:var(--gold);font-size:calc(1.05rem * var(--title-scale));margin-bottom:4px;}
  .call-card span{font-family:var(--font-base);font-size:calc(0.85rem * var(--base-scale));opacity:0.85;}
  @media (max-width:520px){.call-grid{grid-template-columns:1fr;}}

  .book-form-card{background:var(--surface);border-radius:16px;box-shadow:0 14px 34px var(--shadow-soft);padding:36px 32px;border-top:6px solid var(--gold);}
  .book-form-card h3{font-family:var(--font-title);font-weight:600;font-size:calc(1.5rem * var(--title-scale));color:var(--maroon);margin-bottom:10px;}
  .book-form-card > p{font-family:var(--font-body);color:var(--ink-soft);font-size:calc(0.98rem * var(--body-scale));line-height:1.55;margin-bottom:22px;}
  .book-form{display:flex;flex-direction:column;gap:16px;}
  .book-form label{font-family:var(--font-base);font-size:calc(0.78rem * var(--base-scale));text-transform:uppercase;letter-spacing:0.08em;color:var(--maroon);font-weight:700;margin-bottom:6px;display:block;}
  .book-form input, .book-form select, .book-form textarea{width:100%;padding:13px 14px;border-radius:8px;border:1.5px solid var(--divider);background:var(--cream);font-family:var(--font-base);font-size:calc(0.98rem * var(--base-scale));color:var(--ink);}
  .book-form input:focus, .book-form select:focus, .book-form textarea:focus{outline:none;border-color:var(--maroon);}
  .form-row{display:flex;gap:14px;}
  .form-row .fld{flex:1;}
  @media (max-width:600px){.form-row{flex-direction:column;}}
  .book-form button{align-self:flex-start;margin-top:4px;}
  @media (max-width:900px){.booking-grid{grid-template-columns:1fr;}}

  /* ---------- Location / FAQ / Contact (shared with festival pattern) ---------- */
  .location-grid{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center;}
  .location-info b{display:block;font-family:var(--font-title);font-weight:600;font-size:calc(1.25rem * var(--title-scale));color:var(--maroon);margin-bottom:8px;}
  .location-info p{font-family:var(--font-body);color:var(--ink-soft);line-height:1.7;font-size:calc(1.05rem * var(--body-scale));margin-bottom:18px;}
  .map-frame{border-radius:8px;overflow:hidden;box-shadow:0 14px 30px var(--shadow-soft);aspect-ratio:4/3;}
  .map-frame iframe{width:100%;height:100%;border:0;}
  @media (max-width:760px){.location-grid{grid-template-columns:1fr;}.about-grid{grid-template-columns:1fr;}.about-photo,.about-video{order:-1;}}

  .faq-list{max-width:720px;margin:0 auto;}
  .faq-item{border-bottom:1px solid var(--divider);}
  .faq-q{width:100%;text-align:left;background:none;border:none;font-family:var(--font-base);font-size:calc(1.03rem * var(--base-scale));font-weight:600;color:var(--ink);padding:20px 6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;}
  .faq-q .icon{font-family:var(--font-title);color:var(--maroon);font-size:calc(1.3rem * var(--title-scale));transition:transform .2s ease;}
  .faq-item.open .icon{transform:rotate(45deg);}
  .faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease;font-family:var(--font-body);color:var(--ink-soft);line-height:1.7;font-size:calc(1.03rem * var(--body-scale));padding:0 6px;}
  .faq-item.open .faq-a{padding-bottom:20px;}

  .contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px;max-width:1000px;margin:0 auto;}
  .contact-card{background:var(--surface);border-radius:12px;border-top:6px solid var(--gold);box-shadow:0 12px 28px var(--shadow-soft);padding:30px 26px 26px;display:flex;flex-direction:column;align-items:center;text-align:center;transition:transform .2s ease;}
  .contact-card:hover{transform:translateY(-4px);}
  .cc-icon{width:58px;height:58px;border-radius:50%;background:var(--maroon);color:var(--cream);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
  .cc-icon svg{width:28px;height:28px;}
  .contact-card h3{font-family:var(--font-title);font-weight:600;font-size:calc(1.3rem * var(--title-scale));color:var(--maroon);margin:0 0 8px;line-height:1.2;}
  .contact-card p{font-family:var(--font-body);color:var(--ink-soft);font-size:calc(1rem * var(--body-scale));line-height:1.6;margin:0 0 22px;flex-grow:1;}

<script>

  function esc(s){
    return (s ?? '').toString().replace(/[&<>"']/g, ch => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[ch]);
  }

  function safeExternalUrl(value){
    if(!value) return '#';
    try{
      const url = new URL(value, window.location.origin);
      return ['http:', 'https:', 'mailto:', 'tel:', 'sms:'].includes(url.protocol) ? url.href : '#';
    }catch(e){
      return '#';
    }
  }

  function safeLink(value){
    const v = (value || '').toString().trim();
    if(v.startsWith('#')) return v;
    return safeExternalUrl(v);
  }

  // ---------- Page layout: the ordered list of sections/tabs, controlled from /admin ----------
  const BUILTIN_LABELS = {
    about:'About', services:'Services', gallery:'Gallery',
    booking:'Book Now', location:'Location', faq:'FAQ', contact:'Contact'
  };
  const DEFAULT_LAYOUT = Object.keys(BUILTIN_LABELS).map(k => (
    {type:'builtin', section:k, navLabel:BUILTIN_LABELS[k], showInNav:true, visible:true}
  ));

  function slugify(s){
    const base = (s || '').toString().toLowerCase().replace(/&/g,' and ')
      .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
    return base || 'section';
  }

  function paragraphsHtml(list){
    return (list || [])
      .map(p => (typeof p === 'string') ? p : (p && p.text) || '')
      .filter(Boolean)
      .map(p => `<p>${esc(p)}</p>`).join('');
  }

  function buildCustomSection(item, id){
    const sec = document.createElement('section');
    sec.id = id;
    sec.setAttribute('data-custom', '1');
    const kicker = item.kicker ? `<span class="kicker">${esc(item.kicker)}</span>` : '';
    const heading = item.heading ? `<h2 class="display">${esc(item.heading)}</h2>` : '';

    if(item.type === 'info'){
      const photos = (item.photos || []).filter(p => p && p.img);
      const cls = 'cs-info' + (item.photoSide === 'left' ? ' photos-left' : '') + (photos.length ? '' : ' solo');
      sec.innerHTML = `
        <div class="section-inner ${cls}">
          <div class="cs-text">
            ${item.kicker ? `<span class="cs-kicker">${esc(item.kicker)}</span>` : ''}
            ${item.heading ? `<h2 class="display cs-heading">${esc(item.heading)}</h2>` : ''}
            ${paragraphsHtml(item.paragraphs)}
          </div>
          ${photos.length ? `<div class="cs-photos">${photos.map(p =>
            `<img src="${esc(p.img)}" alt="${esc(p.alt || item.heading || '')}" loading="lazy">`).join('')}</div>` : ''}
        </div>
        ${item.footnote ? `<div class="section-inner"><p class="cs-footnote">${esc(item.footnote)}</p></div>` : ''}`;
    } else { // 'text'
      const link = safeLink(item.buttonLink);
      const external = !link.startsWith('#');
      sec.innerHTML = `
        <div class="section-inner cs-textblock">
          <div class="section-head">${kicker}${heading}</div>
          <div class="cs-body">${paragraphsHtml(item.paragraphs)}</div>
          ${item.buttonText && item.buttonLink ? `<a class="btn btn-primary" href="${esc(link)}"${external ? ' target="_blank" rel="noopener noreferrer"' : ''}>${esc(item.buttonText)}</a>` : ''}
        </div>`;
    }
    return sec;
  }

  function buildLayout(data, site){
    const main = document.getElementById('sections');
    main.querySelectorAll('[data-custom]').forEach(n => n.remove());
    const items = (Array.isArray(data.pageSections) && data.pageSections.length) ? data.pageSections : DEFAULT_LAYOUT;

    const used = new Set(['home','sections','tabnav','tabnavInner', ...Object.keys(BUILTIN_LABELS)]);
    const placed = new Set();
    const visibleNodes = [];
    const tabs = [{id:'home', label: site.homeNavLabel || 'Home'}];

    items.forEach(item => {
      if(!item) return;
      let node, id, label = (item.navLabel || '').trim();
      if(item.type === 'builtin'){
        id = item.section;
        if(!BUILTIN_LABELS[id] || placed.has(id)) return;
        node = document.getElementById(id);
        if(!node) return;
        placed.add(id);
        label = label || BUILTIN_LABELS[id];
      }else{
        const base = slugify(item.navLabel || item.heading);
        id = base; let n = 2;
        while(used.has(id)) id = base + '-' + (n++);
        used.add(id);
        node = buildCustomSection(item, id);
        label = label || item.heading || 'Section';
      }
      main.appendChild(node);
      const show = item.visible !== false;
      node.hidden = !show;
      if(show){
        visibleNodes.push({node, item});
        if(item.showInNav !== false) tabs.push({id, label});
      }
    });

    Object.keys(BUILTIN_LABELS).forEach(id => {
      if(!placed.has(id)){
        const n = document.getElementById(id);
        if(n){ n.hidden = true; main.appendChild(n); }
      }
    });

    visibleNodes.forEach(({node, item}, i) => {
      node.classList.remove('section-alt', 'cs-dark');
      const bg = item.type === 'builtin' ? 'auto' : (item.background || 'auto');
      if(bg === 'alt' || (bg === 'auto' && i % 2 === 1)) node.classList.add('section-alt');
      else if(bg === 'dark') node.classList.add('cs-dark');
    });

    return { tabs, visible: new Set(visibleNodes.map(v => v.node.id)) };
  }

    email:'<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1.6 2L12 12.4 19.4 7H4.6zM4 9.1V17h16V9.1l-8 5.8-8-5.8z"/></svg>'
  };
  function socialKey(link){
    const url = (link.url || '').trim();
    if(/^mailto:/i.test(url)) return 'email';
    try{
      const host = new URL(url).hostname.toLowerCase().replace(/^www\./, '');
      for(const h in SOCIAL_HOSTS){ if(host === h || host.endsWith('.' + h)) return SOCIAL_HOSTS[h]; }
    }catch(e){}
    return SOCIAL_NAMES[(link.label || '').trim().toLowerCase()] || null;
  }
  function socialLinkHtml(link){
    const key = socialKey(link);
    const href = esc(safeExternalUrl(link.url));
    const name = esc(link.label);
    const isMail = /^mailto:/i.test((link.url || '').trim());
    const target = isMail ? '' : ' target="_blank" rel="noopener noreferrer"';
    if(key && SOCIAL_ICONS[key]){
      return `<a href="${href}"${target} aria-label="${name}" title="${name}"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="${SOCIAL_ICONS[key]}"/></svg><span class="sr-only">${name}</span></a>`;
    }
    if(key === 'email'){
      return `<a href="${href}" aria-label="${name}" title="${name}">${SOCIAL_FALLBACK_SVG.email}<span class="sr-only">${name}</span></a>`;
    }
    return `<a class="social-text" href="${href}"${target}>${name}</a>`;
  }

  // ---------- Meta Pixel ----------
  let trackingStarted = false;
  function initTracking(data){
    const id = String(((data.tracking || {}).metaPixelId) || '').trim();
    if(trackingStarted || !/^\d{8,20}$/.test(id)) return;
    trackingStarted = true;
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', id);
    fbq('track', 'PageView');
    document.addEventListener('click', function(ev){
      const a = ev.target.closest && ev.target.closest('a');
      if(!a || !window.fbq) return;
      if(a.id === 'bookOnlineBtn') fbq('track', 'InitiateCheckout');
      else if(a.closest('.contact-card') || /^(mailto:|tel:)/i.test(a.getAttribute('href') || '')) fbq('track', 'Lead');
    });
  }

  // ---------- Phone numbers (pulled from Contact cards that use tel: links) ----------
  function phoneContacts(data){
    return (data.contact && data.contact.cards || [])
      .filter(c => c && c.link && /^tel:/i.test(c.link.trim()))
      .map(c => ({label: c.title || 'Call us', href: c.link.trim(), display: c.button || c.link.replace(/^tel:\+?1?/i,'')}));
  }

  // ---------- SEO: structured LocalBusiness data ----------
  function buildStructuredData(data, pageUrl, imageUrl){
    const site = data.site || {};
    const loc = data.location || {};
    const phones = phoneContacts(data);
    const am = /^(.*?),\s*([^,]+),\s*([A-Z]{2})\s+(\d{5})/.exec(loc.mapQuery || '');
    const address = am
      ? { '@type':'PostalAddress', streetAddress: am[1], addressLocality: am[2], addressRegion: am[3], postalCode: am[4], addressCountry:'US' }
      : (loc.mapQuery || undefined);
    return {
      '@context':'https://schema.org',
      '@type':'HairSalon',
      name: site.footerName || data.hero.title,
      description: site.metaDescription || undefined,
      image: [imageUrl],
      url: pageUrl,
      telephone: phones[0] ? phones[0].href.replace(/^tel:/,'') : undefined,
      address: address,
      priceRange: '$$'
    };
  }

  // ---------- Calendar helpers ----------
  function parseTimeToMin(t){
    const m = /^(\d{1,2})(?::(\d{2}))?\s*([ap])?m?$/i.exec(String(t || '').trim());
    if(!m) return null;
    let h = Number(m[1]); const min = Number(m[2] || 0); const ap = (m[3] || '').toLowerCase();
    if(ap){ if(h === 12) h = 0; if(ap === 'p') h += 12; }
    return h * 60 + min;
  }
  function fmtMin(total){
    let h = Math.floor(total / 60); const m = total % 60;
    const ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return `${h}:${String(m).padStart(2, '0')} ${ap}`;
  }
  function whenText(){
    const d = document.getElementById('f_date').value;
    const t = document.getElementById('f_time').value;
    if(!d || !t) return '';
    const [y, mo, da] = d.split('-').map(Number);
    const label = new Date(y, mo - 1, da).toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
    return `${label} at ${t}`;
  }

      mail:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>',
      phone:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8c1.4 2.9 3.7 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.2 1L6.6 10.8z"/></svg>',
      pin:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C7.6 2 4 5.6 4 10c0 5.4 7 11.5 7.3 11.7.2.2.5.3.7.3s.5-.1.7-.3C13 21.5 20 15.4 20 10c0-4.4-3.6-8-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>'
    };
    const emailAddr = (ct.email || '').trim();
    const emailBox = document.getElementById('contactEmail');
    emailBox.hidden = !emailAddr;
    if(emailAddr){
      emailBox.innerHTML = `<span class="ce-label">${esc(ct.emailLabel || 'Questions? Email us anytime')}</span><a href="mailto:${esc(emailAddr)}">${CI.mail}<span>${esc(emailAddr)}</span></a>`;
    }
    document.getElementById('contactGrid').innerHTML = (ct.cards || []).filter(c => c && c.title && c.link).map((c, i) => {
      const href = safeLink(c.link);
      const isTelOrMail = /^(tel:|mailto:)/i.test(href);
      const ext = /^https?:/i.test(href) || /\.pdf($|\?)/i.test(href);
      const icon = /^tel:/i.test(href) ? CI.phone : (/^mailto:/i.test(href) ? CI.mail : CI.pin);
      return `<div class="contact-card"><div class="cc-icon">${icon}</div><h3>${esc(c.title)}</h3><p>${esc(c.desc || '')}</p><a class="cc-btn" href="${esc(href)}"${ext && !isTelOrMail ? ' target="_blank" rel="noopener noreferrer"' : ''}><span>${esc(c.button || 'Learn More')}</span></a></div>`;
    }).join('');

    // Location
    document.getElementById('locationInfo').innerHTML = `
      <b>${esc(data.location.title)}</b>
      ${(data.location.paragraphs || []).map(p => `<p>${esc(p)}</p>`).join('')}
      <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(data.location.mapQuery)}"
         target="_blank" rel="noopener noreferrer"
         class="btn btn-outline" style="border-color:var(--maroon);color:var(--maroon);">${esc(site.directionsButtonText || 'Get Directions')}</a>
    `;
    document.getElementById('mapFrame').innerHTML = `<iframe src="https://maps.google.com/maps?q=${encodeURIComponent(data.location.mapQuery)}&t=&z=14&ie=UTF8&iwloc=&output=embed" title="Map" loading="lazy"></iframe>`;

    // FAQ
    document.getElementById('faqList').innerHTML = (data.faq || []).map((f, i) => `
      <div class="faq-item${i === 0 ? ' open' : ''}">
        <button class="faq-q">${esc(f.q)} <span class="icon">+</span></button>
        <div class="faq-a"><p>${esc(f.a)}</p></div>
      </div>
    `).join('');

    // Footer
    document.getElementById('footerContent').innerHTML = `
      <div class="display">${esc(site.footerName || 'Rivas Super Salon')}</div>
      <p style="opacity:0.85;">${esc(data.footer.tagline)}</p>
      <div class="foot-links">
        ${layout.tabs.filter(t => t.id !== 'home').map(t => `<a href="#${esc(t.id)}">${esc(t.label)}</a>`).join('')}
      </div>
      ${(data.socials || []).filter(link => link.label && link.url).length ? `<div class="social-links">
        ${(data.socials || []).filter(link => link.label && link.url).map(socialLinkHtml).join('')}
      </div>` : ''}
      <p class="fine">${esc(data.footer.note)}</p>
    `;

    initTracking(data);
    initInteractions(data);
  }

  function initInteractions(data){
    const navLinks = Array.from(document.querySelectorAll('.tabnav a'));
    const sections = navLinks.map(l => document.getElementById((l.getAttribute('href') || '').slice(1)));
    function onScroll(){
      let current = sections[0];
      const y = window.scrollY + 120;
      sections.forEach(sec => { if(sec && !sec.hidden && sec.offsetTop <= y) current = sec; });
      navLinks.forEach(l => l.classList.toggle('active', !!current && l.getAttribute('href') === '#' + current.id));
    }
    window.addEventListener('scroll', onScroll, {passive:true});
    onScroll();

    document.querySelectorAll('.faq-item').forEach(item => {
      const q = item.querySelector('.faq-q');
      const a = item.querySelector('.faq-a');
      if(item.classList.contains('open')) a.style.maxHeight = a.scrollHeight + 'px';
      q.addEventListener('click', () => {
        const isOpen = item.classList.contains('open');
        document.querySelectorAll('.faq-item').forEach(i => { i.classList.remove('open'); i.querySelector('.faq-a').style.maxHeight = null; });
        if(!isOpen){ item.classList.add('open'); a.style.maxHeight = a.scrollHeight + 'px'; }
      });
    });

    // Lightbox close
    const lightbox = document.getElementById('lightbox');
    const closeLightbox = () => { lightbox.classList.remove('show'); document.getElementById('lightboxImg').src = ''; };
    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => { if(e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeLightbox(); });

    // Booking request form -> opens as pre-filled SMS
    const form = document.getElementById('bookForm');
    if(form && !form.dataset.wired){
      form.dataset.wired = '1';
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('f_name').value.trim();
        const phone = document.getElementById('f_phone').value.trim();
        const service = document.getElementById('f_service').value;
        const notes = document.getElementById('f_notes').value.trim();
        const telHref = document.getElementById('f_lang').value;
        if(!telHref) return;
        const digits = telHref.replace(/\D/g, '');
        const stylist = document.getElementById('f_staff').value;
        const when = whenText();
        const body = `Hi! I'd like to book: ${service}.${stylist ? ' Stylist: ' + stylist + '.' : ''}${when ? ' Preferred time: ' + when + '.' : ''} Name: ${name}. Phone: ${phone}.${notes ? ' Notes: ' + notes : ''}`;
        window.location.href = `sms:+${digits}?&body=${encodeURIComponent(body)}`;
      });
    }

    // Booking request form -> "Email Instead" fallback
    const emailBtn = document.getElementById('formEmailBtn');
    if(emailBtn && !emailBtn.dataset.wired){
      emailBtn.dataset.wired = '1';
      emailBtn.addEventListener('click', () => {
        const notifyEmail = emailBtn.dataset.notifyEmail;
        if(!notifyEmail) return;
        const bookForm = document.getElementById('bookForm');
        if(bookForm && !bookForm.reportValidity()) return;
        const when = whenText();
        const name = document.getElementById('f_name').value.trim();
        const phone = document.getElementById('f_phone').value.trim();
        const service = document.getElementById('f_service').value;
        const notes = document.getElementById('f_notes').value.trim();
        const subject = `Appointment Request${name ? ' — ' + name : ''}`;
        const stylist = document.getElementById('f_staff').value;
        const body = `Name: ${name}\nPhone: ${phone}\nService: ${service}\n${when ? 'When: ' + when + '\n' : ''}${stylist ? 'Stylist: ' + stylist + '\n' : ''}${notes ? 'Notes: ' + notes : ''}`;
        window.location.href = `mailto:${notifyEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      });
    }
  }

  // ---------- Spanish translation toggle (Google Translate widget, triggered by our own button) ----------
  function googleTranslateElementInit(){
    try{
      new google.translate.TranslateElement({pageLanguage:'en', includedLanguages:'es', autoDisplay:false}, 'google_translate_element');
    }catch(e){ console.error(e); }
  }
  window.googleTranslateElementInit = googleTranslateElementInit;

  // The button lives inside the About section, which render() rebuilds, so this re-binds
  // the click handler to the fresh button each time and keeps the label in sync with state.
  let isSpanishActive = false;
  function attachTranslateToggle(){
    const btn = document.getElementById('translateToggle');
    if(!btn) return;
    const label = btn.querySelector('.full-label');
    if(label) label.textContent = isSpanishActive ? 'Back to English' : 'Translate to Spanish';
    let attempts = 0;
    function applyLanguage(){
      const combo = document.querySelector('.goog-te-combo');
      if(!combo){
        attempts++;
        if(attempts < 40) setTimeout(applyLanguage, 250);
        return;
      }
      combo.value = isSpanishActive ? 'es' : 'en';
      combo.dispatchEvent(new Event('change'));
    }
    btn.addEventListener('click', () => {
      isSpanishActive = !isSpanishActive;
      if(label) label.textContent = isSpanishActive ? 'Back to English' : 'Translate to Spanish';
      attempts = 0;
      applyLanguage();
    });
  }

  fetch('content.json?_=' + Date.now())
    .then(r => {
      if(!r.ok) throw new Error('Could not load content.json');
      return r.json();
    })
    .then(render)
    .catch(err => {
      console.error(err);
      document.getElementById('heroContent').innerHTML = `
        <p class="presents">Rivas Super Salon</p>
        <h1 class="display hero-title anim-none">Rivas Super Salon</h1>
        <p class="hero-subtitle">Site information is temporarily unavailable.</p>
      `;
    });
</script>
