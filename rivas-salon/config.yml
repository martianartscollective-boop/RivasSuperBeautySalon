backend:
  name: git-gateway
  branch: main

local_backend: false

media_folder: "images"
public_folder: "/images"

collections:
  - name: "content"
    label: "Website Content"
    files:
      - file: "content.json"
        label: "Rivas Super Salon — All Content"
        name: "content"
        fields:

          - label: "Website Settings"
            name: "settings"
            widget: "object"
            fields:
              - label: "Header Background Photo"
                name: "coverImage"
                widget: "image"
                required: false
                hint: "The big photo behind the salon name at the top of the site. Pick a wide, bright, in-focus shot — a haircut or styling moment works best."

              - label: "Hero Logo (optional, instead of text)"
                name: "heroLogo"
                widget: "image"
                required: false
                hint: "Leave blank to show the salon name as text (recommended). Only fill this in if you have a logo graphic you'd rather show instead."

              - label: "Hero Entrance Animation"
                name: "heroAnimation"
                widget: "select"
                options:
                  - {label: "Fade Up", value: "fadeUp"}
                  - {label: "Pop / Zoom In", value: "pop"}
                  - {label: "Slide In From Left", value: "slideLeft"}
                  - {label: "Flip In", value: "flipIn"}
                  - {label: "None (no animation)", value: "none"}
                default: "fadeUp"
                hint: "How the salon name animates in when someone loads the homepage."

              - label: "Animation Speed (seconds)"
                name: "heroAnimationSeconds"
                widget: "number"
                value_type: "float"
                min: 0.3
                max: 4
                default: 1.1
                hint: "Lower = snappier/faster. Higher = slower and more dramatic."

              - label: "Browser Tab Icon"
                name: "siteIcon"
                widget: "image"
                required: false
                hint: "Upload a SQUARE picture, at least 512 x 512 pixels. Leave blank to keep the current icon."

              - label: "Mobile / Social Sharing Picture"
                name: "shareImage"
                widget: "image"
                required: false
                hint: "Optional. Shown when someone shares your site link on social media or texts."

              - label: "Google / SEO"
                name: "seo"
                widget: "object"
                collapsed: true
                fields:
                  - {label: "Your website address", name: "siteUrl", widget: "string", required: false, hint: "Example: https://rivassupersalon.com — no slash at the end. Leave blank to use whatever address the site is being viewed at."}
                  - {label: "Business name (for Google)", name: "organizerName", widget: "string", required: false}

              - label: "Typography (fonts, sizes & text colors)"
                name: "typography"
                widget: "object"
                collapsed: true
                hint: "'Title Font' covers headings and labels (service names, section titles). 'Body Font' covers longer text (about paragraphs, descriptions, FAQ answers). 'Base Font' covers navigation, buttons, and prices."
                fields:
                  - {label: "Title Font", name: "titleFont", widget: "select", default: "Fraunces", options: ["Fraunces","Playfair Display","Libre Caslon Display","Cormorant Garamond","Oswald","Abril Fatface"]}
                  - {label: "Title Size (% of normal)", name: "titleSize", widget: "number", value_type: "int", min: 60, max: 160, default: 100}
                  - {label: "Title Color (section headings)", name: "titleColor", widget: "color", default: "#c9972e", colorPresets: ["#c9972e", "#9c7220", "#7c2c4b", "#4a1229", "#e8657d", "#faf3ec", "#2b1420"], allowInput: true}

                  - {label: "Body / Description Font", name: "bodyFont", widget: "select", default: "Jost", options: ["Jost","Nunito","Inter","Merriweather","Georgia","Work Sans"]}
                  - {label: "Body Size (% of normal)", name: "bodySize", widget: "number", value_type: "int", min: 60, max: 160, default: 100}
                  - {label: "Body / Description Text Color", name: "bodyColor", widget: "color", default: "#5c4a46", colorPresets: ["#c9972e", "#9c7220", "#7c2c4b", "#4a1229", "#e8657d", "#faf3ec", "#2b1420"], allowInput: true}

                  - {label: "Base / UI Font (nav, buttons, prices)", name: "baseFont", widget: "select", default: "Jost", options: ["Jost","Inter","Poppins","Montserrat","Work Sans","Nunito"]}
                  - {label: "Base Size (% of normal)", name: "baseSize", widget: "number", value_type: "int", min: 60, max: 160, default: 100}

              - label: "Website Colors"
                name: "colors"
                widget: "object"
                collapsed: true
                hint: "Tap any swatch to open a color picker, or tap a preset square for one of the salon's brand colors."
                fields:
                  - {label: "Hero Gradient — Center", name: "sunset1", widget: "color", default: "#7c2c4b", colorPresets: ["#c9972e", "#9c7220", "#7c2c4b", "#4a1229", "#2e0b1b", "#e8657d"], allowInput: true}
                  - {label: "Hero Gradient — Mid", name: "sunset2", widget: "color", default: "#4a1229", colorPresets: ["#c9972e", "#9c7220", "#7c2c4b", "#4a1229", "#2e0b1b", "#e8657d"], allowInput: true}
                  - {label: "Hero Gradient — Outer", name: "sunset3", widget: "color", default: "#2e0b1b", colorPresets: ["#c9972e", "#9c7220", "#7c2c4b", "#4a1229", "#2e0b1b", "#e8657d"], allowInput: true}
                  - {label: "Hero Gradient — Edge 1", name: "dusk1", widget: "color", default: "#4a1229", colorPresets: ["#c9972e", "#9c7220", "#7c2c4b", "#4a1229", "#2e0b1b", "#e8657d"], allowInput: true}
                  - {label: "Hero Gradient — Edge / Footer Color", name: "dusk2", widget: "color", default: "#2e0b1b", colorPresets: ["#c9972e", "#9c7220", "#7c2c4b", "#4a1229", "#2e0b1b", "#e8657d"], allowInput: true}

                  - {label: "Gold / Main Accent", name: "gold", widget: "color", default: "#c9972e", colorPresets: ["#c9972e", "#9c7220", "#7c2c4b", "#4a1229", "#2e0b1b", "#e8657d"], allowInput: true}
                  - {label: "Dark Gold / Button Shadow", name: "goldDeep", widget: "color", default: "#9c7220", colorPresets: ["#c9972e", "#9c7220", "#7c2c4b", "#4a1229", "#2e0b1b", "#e8657d"], allowInput: true}
                  - {label: "Wine / Secondary Accent — featured service card & highlights", name: "maroon", widget: "color", default: "#7c2c4b", colorPresets: ["#c9972e", "#9c7220", "#7c2c4b", "#4a1229", "#2e0b1b", "#e8657d"], allowInput: true}
                  - {label: "Dark Wine Accent", name: "maroonDeep", widget: "color", default: "#4a1229", colorPresets: ["#c9972e", "#9c7220", "#7c2c4b", "#4a1229", "#2e0b1b", "#e8657d"], allowInput: true}
                  - {label: "Rose Accent", name: "teal", widget: "color", default: "#e8657d", colorPresets: ["#c9972e", "#9c7220", "#7c2c4b", "#4a1229", "#2e0b1b", "#e8657d"], allowInput: true}

                  - {label: "Main Background / Cream", name: "cream", widget: "color", default: "#faf3ec", colorPresets: ["#faf3ec", "#f1dad3", "#2b1420"], allowInput: true}
                  - {label: "Alternate Section Background", name: "paper", widget: "color", default: "#f1dad3", colorPresets: ["#faf3ec", "#f1dad3", "#2b1420"], allowInput: true}
                  - {label: "Main Text / Navigation", name: "ink", widget: "color", default: "#2b1420", colorPresets: ["#faf3ec", "#f1dad3", "#2b1420"], allowInput: true}
                  - {label: "White / Card Surface", name: "surface", widget: "color", default: "#ffffff", allowInput: true}
                  - {label: "Keyboard Focus Color", name: "focus", widget: "color", default: "#c9972e", allowInput: true}

                  - {label: "Main Shadow", name: "shadow", widget: "color", default: "rgba(46,11,27,0.28)", enableAlpha: true}
                  - {label: "Soft Shadow", name: "shadowSoft", widget: "color", default: "rgba(46,11,27,0.16)", enableAlpha: true}
                  - {label: "Dividers / Borders", name: "divider", widget: "color", default: "rgba(124,44,75,0.20)", enableAlpha: true}
                  - {label: "Hero Text Shadow", name: "heroTextShadow", widget: "color", default: "rgba(0,0,0,0.45)", enableAlpha: true}
                  - {label: "Header Photo Overlay — Top", name: "heroOverlayTop", widget: "color", default: "rgba(46,11,27,0.55)", enableAlpha: true}
                  - {label: "Header Photo Overlay — Bottom", name: "heroOverlayBottom", widget: "color", default: "rgba(46,11,27,0.88)", enableAlpha: true}

          - label: "PAGE LAYOUT — add, remove, hide & reorder sections and tabs"
            name: "pageSections"
            widget: "list"
            hint: "This list IS your website's order, top to bottom. DRAG a row's handle to move it. Use the X to delete it, or switch 'Show this section' off to hide it without deleting. The text inside Services, Gallery, FAQ, etc. is still edited in their own panels further down."
            types:
              - label: "Built-in section (About, Services, Gallery, Book Now, Location, FAQ, Contact)"
                name: "builtin"
                widget: "object"
                summary: "{{fields.navLabel}}"
                fields:
                  - label: "Which section"
                    name: "section"
                    widget: "select"
                    default: "about"
                    options:
                      - {label: "About", value: "about"}
                      - {label: "Services & Pricing", value: "services"}
                      - {label: "Photo Gallery", value: "gallery"}
                      - {label: "Book Now", value: "booking"}
                      - {label: "Location & Map", value: "location"}
                      - {label: "FAQ", value: "faq"}
                      - {label: "Contact", value: "contact"}
                  - {label: "Tab name (what shows in the top menu)", name: "navLabel", widget: "string"}
                  - {label: "Show a tab for it in the top menu?", name: "showInNav", widget: "boolean", default: true}
                  - {label: "Show this section on the website?", name: "visible", widget: "boolean", default: true}

              - label: "Info section (text + photos)"
                name: "info"
                widget: "object"
                summary: "{{fields.navLabel}}"
                fields:
                  - {label: "Tab name (what shows in the top menu)", name: "navLabel", widget: "string"}
                  - {label: "Show a tab for it in the top menu?", name: "showInNav", widget: "boolean", default: true}
                  - {label: "Show this section on the website?", name: "visible", widget: "boolean", default: true}
                  - label: "Background"
                    name: "background"
                    widget: "select"
                    default: "auto"
                    options:
                      - {label: "Automatic (alternates down the page)", value: "auto"}
                      - {label: "Light", value: "light"}
                      - {label: "Alternate tan", value: "alt"}
                      - {label: "Dark color band", value: "dark"}
                  - {label: "Small heading above the title", name: "kicker", widget: "string", required: false}
                  - {label: "Title", name: "heading", widget: "string"}
                  - label: "Paragraphs"
                    name: "paragraphs"
                    widget: "list"
                    required: false
                    field: {label: "Paragraph", name: "text", widget: "text"}
                  - label: "Photos"
                    name: "photos"
                    widget: "list"
                    required: false
                    summary: "{{fields.alt}}"
                    fields:
                      - {label: "Photo", name: "img", widget: "image"}
                      - {label: "Short description (for accessibility)", name: "alt", widget: "string", required: false}
                  - label: "Photos on which side?"
                    name: "photoSide"
                    widget: "select"
                    default: "right"
                    options:
                      - {label: "Right", value: "right"}
                      - {label: "Left", value: "left"}
                  - {label: "Small line of text at the bottom (optional)", name: "footnote", widget: "string", required: false}

              - label: "Text section (centered words + optional button)"
                name: "text"
                widget: "object"
                summary: "{{fields.navLabel}}"
                fields:
                  - {label: "Tab name (what shows in the top menu)", name: "navLabel", widget: "string"}
                  - {label: "Show a tab for it in the top menu?", name: "showInNav", widget: "boolean", default: true}
                  - {label: "Show this section on the website?", name: "visible", widget: "boolean", default: true}
                  - label: "Background"
                    name: "background"
                    widget: "select"
                    default: "auto"
                    options:
                      - {label: "Automatic (alternates down the page)", value: "auto"}
                      - {label: "Light", value: "light"}
                      - {label: "Alternate tan", value: "alt"}
                      - {label: "Dark color band", value: "dark"}
                  - {label: "Small heading above the title", name: "kicker", widget: "string", required: false}
                  - {label: "Title", name: "heading", widget: "string"}
                  - label: "Paragraphs"
                    name: "paragraphs"
                    widget: "list"
                    required: false
                    field: {label: "Paragraph", name: "text", widget: "text"}
                  - {label: "Button text (optional)", name: "buttonText", widget: "string", required: false}
                  - {label: "Button link (optional — a web address, or #booking to jump to a section)", name: "buttonLink", widget: "string", required: false}

          - label: "Site Text & Buttons"
            name: "site"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Browser / Search Title", name: "metaTitle", widget: "string", hint: "The big blue headline people see on Google. Keep it under ~60 characters, salon name first."}
              - {label: "Browser / Search Description", name: "metaDescription", widget: "text", hint: "The gray text under your Google listing. Aim for 120-155 characters."}
              - {label: "Home Tab Name (first tab in the top menu)", name: "homeNavLabel", widget: "string", required: false}

              - {label: "Hero Primary Button", name: "heroPrimaryButton", widget: "string"}
              - {label: "Hero Secondary Button", name: "heroSecondaryButton", widget: "string"}

              - {label: "Services Small Heading", name: "servicesKicker", widget: "string"}
              - {label: "Services Main Heading", name: "servicesTitle", widget: "string"}
              - {label: "Services Note (below the heading)", name: "servicesNote", widget: "text", required: false}

              - {label: "Gallery Small Heading", name: "galleryKicker", widget: "string"}
              - {label: "Gallery Main Heading", name: "galleryTitle", widget: "string"}

              - {label: "Book Now Small Heading", name: "bookingKicker", widget: "string"}
              - {label: "Book Now Main Heading", name: "bookingTitle", widget: "string"}

              - {label: "FAQ Small Heading", name: "faqKicker", widget: "string"}
              - {label: "FAQ Main Heading", name: "faqTitle", widget: "string"}

              - {label: "Directions Button Text", name: "directionsButtonText", widget: "string"}
              - {label: "Footer Business Name", name: "footerName", widget: "string"}

          - label: "Hero (top banner)"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Small line above the name", name: "presents", widget: "string", hint: "Example: Conroe's Full-Service Salon"}
              - {label: "Salon name", name: "title", widget: "string"}
              - {label: "Subtitle", name: "subtitle", widget: "string"}
              - {label: "Street address", name: "addressLine", widget: "string"}
              - {label: "City, State", name: "cityLine", widget: "string"}
              - {label: "Hours line", name: "hoursLine", widget: "string", hint: "Example: Mon–Sun 10am–7pm"}

          - label: "About Section"
            name: "about"
            widget: "object"
            fields:
              - {label: "Small headline above the paragraph", name: "kicker", widget: "string"}
              - label: "Paragraphs"
                name: "paragraphs"
                widget: "list"
                field: {label: "Paragraph", name: "text", widget: "text"}
              - label: "Stats row"
                name: "stats"
                widget: "list"
                fields:
                  - {label: "Number/word", name: "value", widget: "string"}
                  - {label: "Label underneath", name: "label", widget: "string"}
              - {label: "Upload your own video (mp4, optional)", name: "videoFile", widget: "file", required: false, hint: "If you upload one, it shows instead of the YouTube link below."}
              - {label: "Video cover picture (optional)", name: "videoPoster", widget: "image", required: false}
              - {label: "YouTube video (paste the link, optional)", name: "videoId", widget: "string", required: false}
              - {label: "Photo (only used if there is no video)", name: "photo", widget: "image", required: false}

          - label: "Services & Pricing"
            name: "serviceCategories"
            widget: "list"
            summary: "{{title}}"
            hint: "Each category becomes a tab inside the Services section. Drag categories or services to reorder."
            fields:
              - {label: "Category Name", name: "title", widget: "string"}
              - label: "Services in this category"
                name: "items"
                widget: "list"
                summary: "{{name}} — {{price}}"
                fields:
                  - {label: "Service Name", name: "name", widget: "string"}
                  - {label: "Price", name: "price", widget: "string", hint: "Example: $30 or $150–$350"}
                  - {label: "Unit (optional)", name: "unit", widget: "string", required: false, hint: "Example: + or /person"}
                  - {label: "Description (optional)", name: "desc", widget: "text", required: false}

          - label: "Photo Gallery"
            name: "gallery"
            widget: "object"
            fields:
              - {label: "Small heading", name: "kicker", widget: "string"}
              - {label: "Title", name: "heading", widget: "string"}
              - {label: "Intro sentence (optional)", name: "intro", widget: "text", required: false}
              - label: "Photos"
                name: "photos"
                widget: "list"
                summary: "{{fields.caption}}"
                fields:
                  - {label: "Photo", name: "img", widget: "image"}
                  - {label: "Caption (optional)", name: "caption", widget: "string", required: false}

          - label: "Ad Tracking (Meta / Facebook / Instagram Pixel)"
            name: "tracking"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Meta Pixel ID", name: "metaPixelId", widget: "string", required: false, hint: "Just the number, like 123456789012345. Leave blank to keep tracking OFF."}

          - label: "Book Now"
            name: "booking"
            widget: "object"
            fields:
              - label: "Online booking link (optional)"
                name: "bookingUrl"
                widget: "string"
                required: false
                hint: "Paste a link from a booking platform (Square Appointments, Vagaro, Booksy, Calendly, a Stripe/Square payment link, etc.) if you want clients to be able to reserve and pay online. Leave blank to hide the online button — clients can still call, text or walk in."
              - {label: "'Book Online' button text", name: "payOnlineLabel", widget: "string", default: "Book & Pay Online"}
              - {label: "Note under the booking options", name: "bookingNote", widget: "text", required: false, hint: "Explains that clients can pay in person OR online — whichever they prefer."}
              - {label: "'Call to Book' heading", name: "callToBookHeading", widget: "string", required: false}
              - {label: "'Call to Book' text", name: "callToBookText", widget: "text", required: false}
              - {label: "Request form heading", name: "formHeading", widget: "string", required: false}
              - {label: "Request form text", name: "formText", widget: "text", required: false}

          - label: "Location"
            name: "location"
            widget: "object"
            fields:
              - {label: "Business name", name: "title", widget: "string"}
              - label: "Paragraphs"
                name: "paragraphs"
                widget: "list"
                field: {label: "Paragraph", name: "text", widget: "text"}
              - {label: "Map address / search text", name: "mapQuery", widget: "string", hint: "Controls both the map and the Get Directions button."}

          - label: "FAQ"
            name: "faq"
            widget: "list"
            summary: "{{q}}"
            fields:
              - {label: "Question", name: "q", widget: "string"}
              - {label: "Answer", name: "a", widget: "text"}

          - label: "Social Media Links"
            name: "socials"
            widget: "list"
            required: false
            summary: "{{label}}"
            hint: "Add, delete, and reorder links. Only links with both a name and a web address appear in the footer. Icons appear automatically for Instagram, Facebook, TikTok, YouTube, X/Twitter and others — just paste the link."
            fields:
              - {label: "Platform / Link Name", name: "label", widget: "string"}
              - {label: "Full URL", name: "url", widget: "string"}

          - label: "Contact Us"
            name: "contact"
            widget: "object"
            fields:
              - {label: "Small heading", name: "kicker", widget: "string", required: false}
              - {label: "Main heading", name: "title", widget: "string"}
              - {label: "Line above the email/phone", name: "emailLabel", widget: "string", required: false}
              - {label: "Email address (optional)", name: "email", widget: "string", required: false}
              - label: "Contact buttons (add, remove, reorder)"
                name: "cards"
                widget: "list"
                summary: "{{title}}"
                fields:
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Short description", name: "desc", widget: "text", required: false}
                  - {label: "Button text", name: "button", widget: "string"}
                  - {label: "Link", name: "link", widget: "string", hint: "A web address, tel:+19362249442 for a phone number, or mailto:you@example.com for email."}

          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - {label: "Tagline under the business name", name: "tagline", widget: "string"}
              - {label: "Fine print", name: "note", widget: "text"}
